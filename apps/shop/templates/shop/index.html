<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home-project</title>
</head>

<body>
    <h1>Главная страница</h1>

    {% if products %}
        {% for product in products %}
            <div class="product-container" style="background-color: crimson; color: white; border: 1px solid black; margin-bottom: 10px; padding: 15px;">
                <h2>Товар: {{ product.product_name }} </h2>
                <p>Описание: {{ product.text }}</p>
                <p>Цена (в рублях): {{ product.price }}</p>
                <small>Дата выпуска товара: {{ product.created_at }}</small>
            </div>
        {% endfor %}
    {% else %}
        <p> товаров еще нет, заходите позже!</p>
    {% endif %}
</body>
</html>
