<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ product.title }}</title>
    </head>
    <body>
        <header>
            <nav>
                <a href="{% url 'shop:home_page' %}">Главная</a>
            </nav>
        </header>

        <a href="javascript:history.back()">&larr;Назад</a>

        <h1>Детали поста:</h1>
        <h2>ID поста: {{ product.id }}</h2>
        <h3>Товар: {{ product.product_name }}</h3>
        <p>{{ product.text }}</p>
        <p>Цена (В рублях): {{ product.price }}</p>
        <p>{{ product.created_at }}</p>
    </body>
</html>
